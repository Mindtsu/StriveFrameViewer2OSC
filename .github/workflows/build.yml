name: Build StriveOSC

# Runs on every push to master, or by hand from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Game__Shipping__Win64

permissions:
  contents: read

jobs:
  build:
    # Pinned image with Visual Studio 2022 (the CMake generator below needs it).
    runs-on: windows-2022
    steps:
    # UE4SS depends on a private repository (Re-UE4SS/UEPseudo) that only
    # GitHub accounts linked to Epic Games can read. The secret holds the
    # private SSH key of such an account (see README).
    - name: Setup GitHub SSH
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.UEPSEUDO_SSH_KEY }}
        known_hosts: unnecessary

    - name: Checkout
      uses: actions/checkout@v4

    # The submodule URL of UEPseudo is https: route it through SSH so the
    # key above is used, then fetch every submodule.
    - name: Fetch submodules
      shell: pwsh
      run: |
        git config --global url."git@github.com:Re-UE4SS/".insteadOf "https://github.com/Re-UE4SS/"
        git config --global url."git@github.com:UE4SS-RE/".insteadOf "https://github.com/UE4SS-RE/"
        git submodule update --init --recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      shell: pwsh
      run: .\Scripts\build_project.ps1

    - name: Package
      shell: pwsh
      run: .\Scripts\package_standalone.ps1

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: StriveOSC
        path: ${{ github.workspace }}\Packages\Standalone\
        if-no-files-found: error
