; =====================================================================
;  StriveOSC - configuration
;  Relancer le jeu après chaque modification.
;  Tout ce qui suit un ";" ou un "#" est un commentaire.
; =====================================================================

; Destination OSC. Seules les adresses locales (127.x.x.x ou localhost)
; sont acceptées : le flux ne sort jamais de l'ordinateur.
host = 127.0.0.1
port = 9000

; Préfixe de toutes les adresses OSC (/ggst/p1/move, /ggst/p1/tension...).
prefix = /ggst

; Modes de jeu où le mod est actif, séparés par des virgules.
;   6 = Versus local      7 = Versus (variante)      8 = Entraînement
;   3 = Arcade            22 = En ligne (déconseillé)
; Le numéro du mode courant est écrit dans UE4SS.log à chaque changement.
modes = 6,7,8

; 1 = envoie /pN/state à chaque changement d'état (marche, garde, coups...)
send_states = 1

; 1 = envoie /frame à chaque frame (60 messages par seconde), utile comme horloge.
send_frame = 0

; 1 = écrit chaque coup détecté dans UE4SS.log. Pratique pour relever les
; noms internes des coups d'un personnage en mode entraînement.
log_moves = 0

; 1 = ignore les frames rejouées par le rollback. À activer uniquement pour
; une partie en ligne : en local, laisser à 0.
skip_rollback_frames = 0

; 1 = écrit dans UE4SS.log des compteurs toutes les 5 secondes environ
; (utile pour comprendre pourquoi des messages manquent).
debug = 0

; Nombre de rounds à gagner pour remporter le match (sert à calculer /pN/lives).
rounds_to_win = 2

; Emplacement de la jauge R.I.S.C. en mémoire, à trouver avec risc_finder.
; Format : player:0x1234 ou engine:0x1234. "none" = pas d'envoi de /pN/risc.
risc_p1 = none
risc_p2 = none

; 1 = active l'outil de recherche de la R.I.S.C. (touches F6, F7, F8 en
; mode entraînement). Voir le README. Remettre à 0 une fois l'offset trouvé.
risc_finder = 0
